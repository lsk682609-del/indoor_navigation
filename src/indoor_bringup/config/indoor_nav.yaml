# 室内导航：直道最高 1 m/s，弯道/障碍附近自动减速。
/**:
  ros__parameters:
    use_sim_time: true
/**/nav2_input_bridge:
  ros__parameters:
    local_odom_topic: /odom
    odom_output_topic: odom_local
    body_offset_x: 0.0
    body_offset_y: 0.0
    body_offset_z: 0.0
    global_frame: map
    robot_base_frame: base_link
    lidar_pcl_topic: /livox/lidar/pointcloud
    lidar_output_topic: cur_lid
    lidar_frame: livox_frame
    crop_enabled: false
    reference_latitude: 0.0
    reference_longitude: 0.0
    reference_altitude: 0.0
    goal_input_topic: unused_gps/gp_goal
    uav_goal_input_topic: unused_gps/uav_goal
    goal_output_topic: unused_gps/goal_pose
    gp_path_input_topic: unused_gps/gp_path
    gp_path_output_topic: unused_gps/path
    log_event_topic: log/event
    log_record_topic: log/record
/**/net_planner_action_server:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    max_snap_distance: 2.1
    edge_snap_enabled: false
    transform_tolerance: 0.5
    dense_path_step: 0.1
    max_dense_path_length: 0.0
    publish_planner_path: true
    planner_path_topic: topology_plan
/**/net_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    goal_match_tolerance: 0.05
    controller_id: FollowPath
    goal_checker_id: general_goal_checker
    follow_path_action: follow_path
    compute_path_action: compute_path_to_pose
    follow_slice_horizon_m: 30.0
    path_progress_min_translation_m: 0.05
    path_progress_max_projection_distance_m: 1.0
    path_progress_passed_point_margin_m: 0.1
    executing_freq_hz: 1.0
    recovery_max_attempts: 2
/**/controller_server:
  ros__parameters:
    odom_topic: /odom
    cmd_vel_pause_topic: pause
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.02
    min_y_velocity_threshold: 0.02
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 5.0
    progress_checker_plugin: progress_checker
    current_goal_checker: general_goal_checker
    goal_checker_plugins:
    - general_goal_checker
    controller_plugins:
    - FollowPath
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.1
      movement_time_allowance: 10.0
    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.2
      yaw_goal_tolerance: 3.15
    FollowPath:
      plugin: nav2_a_star_rpp::RegulatedPurePursuitController
      desired_linear_vel: 1.0
      lookahead_dist: 0.8
      use_velocity_scaled_lookahead_dist: true
      min_lookahead_dist: 0.4
      max_lookahead_dist: 1.0
      lookahead_time: 0.8
      use_interpolation: true
      max_linear_accel: 0.5
      max_linear_decel: 1.0
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 3.0
      regulated_linear_scaling_min_speed: 0.1
      use_cost_regulated_linear_velocity_scaling: false
      cost_scaling_dist: 0.6
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 2.0
      lethal_cost: 253
      start_relax_radius: 0.8
      traversal_cost_weight: 3.0
      path_smoothing_enabled: true
      smoothing_max_iterations: 100
      smoothing_tolerance: 0.0001
      smoothing_data_weight: 0.2
      smoothing_smooth_weight: 0.3
      smoothing_max_deviation: 0.15
      smoothing_collision_step: 0.025
      smoothing_backtracking_steps: 6
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 1.0
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.5
      front_stop_clearance: 0.35
      front_slow_clearance: 1.2
      front_stop_half_width: 0.2
      recovery_front_block_cycles: 3
      use_rotate_to_heading: true
      rotate_to_heading_angular_vel: 0.7
      rotate_to_heading_min_angle: 0.5
      max_angular_accel: 1.57
      allow_reversing: false
      transform_tolerance: 0.5
      max_robot_pose_search_dist: 10.0
      prefer_planner_polyline_when_clear: true
      polyline_collision_check_resolution: 0.05
      polyline_track_max_length: 4.0
      publish_global_path_slice_freeze: true
      publish_merge_connection_point: true
      # 参考原 gazebo_net_nav 的窄门伺服，自动感知当前路线上的通道。
      door_servo_enabled: true
      door_cloud_topic: cur_lid
      door_cloud_timeout: 0.5
      door_detect_range: 2.6
      door_detect_half_width: 1.2
      door_min_height: 0.4
      door_max_height: 2.0
      door_min_width: 0.62
      door_max_width: 1.2
      door_enter_distance: 2.2
      door_align_angle: 0.08
      door_cross_speed: 0.25
      door_max_angular: 0.4
      door_exit_margin: 0.6
      door_exit_hold: 0.4
      door_hold_distance: 0.5
      door_route_tolerance: 0.4
      # 不设置固定门心；使用控制器默认的空列表，避免绑定其他场景坐标。
      recovery_enabled: true
      recovery_backup_distance: 0.35
      recovery_backup_speed: 0.12
      recovery_rear_clearance: 0.1
      recovery_stuck_time: 1.5
      recovery_stuck_translation: 0.05
      recovery_max_cycles: 2
      recovery_retrigger_window: 10.0
      recovery_collision_cycles: 5
      recovery_no_path_cycles: 3
/**/local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 20.0
      publish_frequency: 10.0
      global_frame: map
      robot_base_frame: base_link
      rolling_window: true
      width: 10
      height: 10
      resolution: 0.05
      footprint: '[[0.275,0.23],[0.275,-0.23],[-0.23,-0.23],[-0.23,0.23]]'
      plugins:
      - obstacle_layer
      - inflation_layer
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        enabled: true
        inflation_radius: 0.5
        cost_scaling_factor: 2.0
      always_send_full_costmap: true
      footprint_padding: 0.02
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: lidar
        max_obstacle_height: 2.5
        lidar:
          topic: cur_lid
          data_type: PointCloud2
          marking: true
          clearing: true
          min_obstacle_height: 0.12
          max_obstacle_height: 2.5
          obstacle_max_range: 5.0
          obstacle_min_range: 0.15
          raytrace_max_range: 6.0
          raytrace_min_range: 0.15
/**/nav2_log_record:
  ros__parameters:
    log_output: both
    log_level: info
    log_event_topic: log/event
    log_record_topic: log/record
/**/lifecycle_manager_navigation:
  ros__parameters:
    autostart: true
    bond_timeout: 10.0
    node_names:
    - nav2_log_record
    - nav2_input_bridge
    - net_planner_action_server
    - controller_server
    - net_navigator
